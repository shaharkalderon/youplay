name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the same install, test and build, but stop short of
  # publishing. Without this the tests only ran at deploy time, which is after
  # the decision to merge rather than before it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # There is one Pages site, so deploys share a group and queue behind each
  # other. A pull request is checking a branch rather than publishing, so it
  # gets a group of its own and does not hold up a deploy.
  group: >-
    ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  # Let a running deploy finish rather than cancelling it mid-publish. A check
  # run has no such problem: a new push makes the one before it irrelevant.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the test script's TypeScript directly, no build step.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          # Optional: without these the site builds local-only, no sync UI.
          # Repository variables are the natural home (both values are public by
          # design), but secrets are accepted too.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          # Optional: the New feed. Restrict the key to this site and to the
          # YouTube Data API in Google Cloud; it ships in the public bundle.
          VITE_YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY || secrets.YOUTUBE_API_KEY }}

      # Publishing steps only. A pull request has proved the build compiles,
      # which is the whole point of running it here.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
